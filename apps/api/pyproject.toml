[project]
name = "comfy-gallery-api"
version = "0.1.0-rc.2"
description = "Project Comfy Gallery HTTP API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "comfy-gallery-core",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=5.2.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
comfy-gallery-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_gallery_api"]
