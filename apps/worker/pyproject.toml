[project]
name = "comfy-gallery-worker"
version = "0.1.0-rc.9"
description = "Project Comfy Gallery background worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "comfy-gallery-core",
    "dramatiq[redis,watch]>=1.18.0",
    "redis[hiredis]>=5.2.0",
]

[tool.uv.sources]
comfy-gallery-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_gallery_worker"]
