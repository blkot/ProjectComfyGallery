[project]
name = "comfy-gallery-core"
version = "0.1.0-rc.2"
description = "Shared domain, database, configuration, and security foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "dramatiq[redis]>=2.2.0",
    "pillow>=12.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "structlog>=25.1.0",
    "uuid6>=2024.7.10",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_gallery_core"]
