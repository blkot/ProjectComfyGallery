<script>
(() => {
  const root = document.getElementById('cg-photos-design');
  const assets = __MEDIA_DATA__;
  const iconData = '__APP_ICON__';
  root.querySelector('[data-app-icon]').src = iconData;
  const $ = (q) => root.querySelector(q);
  const $$ = (q) => [...root.querySelectorAll(q)];
  const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const refreshIcons = () => { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:21,height:21}}); };
  const defaults = {kind:'all',favorite:'all',trash:'hide',sort:'added',rating:'all'};
  const state = {tab:'library',filters:{...defaults},query:'',selecting:false,selected:new Set(),viewer:null,viewerIds:[],draft:null,playing:false,muted:false};
  const design = {columns:3,appearance:'system',availability:'normal',grouping:'days'};
  const scenes = ['海岸','山脉','日落','海浪','草地','公路','云海','岩石','岛屿','花园','天空','海湾'];
  const media = Array.from({length:30},(_,i)=>({id:i,asset:i%assets.length,name:scenes[i%scenes.length],kind:[2,4,7,11,15,20,24,28].includes(i)?'video':'image',favorite:[0,3,5,8,11,13,19,23].includes(i),trash:i===29,rating:'sfw',day:i<12?'2026年11月7日':i<21?'2026年11月6日':'2026年11月5日',time:`${17-Math.floor(i/10)}:${String(54-i%10*4).padStart(2,'0')}`}));
  let toastTimer,playTimer,returnFocus,lastScroll=0;
  function filtered(filters=state.filters) { return media.filter(m=>(filters.kind==='all'||m.kind===filters.kind)&&(filters.favorite==='all'||m.favorite===(filters.favorite==='yes'))&&(state.tab!=='favorites'||m.favorite)&&(filters.trash==='include'||m.trash===(filters.trash==='only'))&&(filters.rating==='all'||m.rating===filters.rating)&&(!state.query||m.name.includes(state.query)||m.kind.includes(state.query))).sort((a,b)=>filters.sort==='oldest'?b.id-a.id:a.id-b.id); }
  function persist() { const host=globalThis.openai;if(host?.setWidgetState)host.setWidgetState({modelContent:{design:'Photos-first',columns:design.columns,appearance:design.appearance,tab:state.tab,filters:state.filters},privateContent:{query:state.query}}).catch(()=>{}); }
  function restore(s) { const m=s?.modelContent;if(!m)return;if(['library','favorites','search'].includes(m.tab))state.tab=m.tab;if([2,3,5].includes(m.columns))design.columns=m.columns;if(['system','light','dark'].includes(m.appearance))design.appearance=m.appearance;state.filters={...defaults,...m.filters};state.query=typeof s.privateContent?.query==='string'?s.privateContent.query:''; }
  restore(globalThis.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
  function toast(text) {clearTimeout(toastTimer);$('.cg-toast').textContent=text;$('.cg-toast').hidden=false;toastTimer=setTimeout(()=>$('.cg-toast').hidden=true,2300);}
  function itemMarkup(m) { const selected=state.selected.has(m.id);return `<button class="cg-tile${selected?' selected':''}" data-media="${m.id}" aria-label="${m.kind==='image'?'图片':'视频'}，${m.name}${m.favorite?'，已收藏':''}${m.trash?'，废纸篓':''}" ${state.selecting?`aria-pressed="${selected}"`:''}><img src="${assets[m.asset]}" alt="" draggable="false">${m.favorite&&!state.selecting?`<span class="cg-fav">${icon('heart')}</span>`:''}${m.kind==='video'&&!state.selecting?`<span class="cg-badge">${icon('play')}0:12</span>`:''}${state.selecting?`<span class="cg-select-mark ${selected?'on':''}">${selected?icon('check'):''}</span>`:''}</button>`; }
  function render() {
    root.style.colorScheme=design.appearance==='system'?'light dark':design.appearance;
    root.style.setProperty('--cg-columns',design.columns);
    const items=design.availability==='empty'?[]:filtered();
    $('[data-title]').textContent=state.selecting?`已选择 ${state.selected.size} 项`:{library:'图库',favorites:'收藏',search:'搜索'}[state.tab];
    $('[data-action="select"]').textContent=state.selecting?'完成':'选择';
    $('.cg-dock').hidden=state.selecting;$('.cg-bulk').hidden=!state.selecting;
    $('[data-action="bulk-favorite"]').disabled=!state.selected.size||design.availability==='offline';
    $('[data-action="bulk-trash"]').disabled=!state.selected.size||design.availability==='offline';
    $('[data-action="select-all"]').disabled=!items.length;
    $('.cg-search-box').hidden=state.tab!=='search';
    const input=$('.cg-search-box input');if(input.value!==state.query)input.value=state.query;
    $$('.cg-tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false');});
    const kindLabel={all:'全部媒体',image:'图片',video:'视频'}[state.filters.kind];
    $('[data-scope]').textContent=`${kindLabel} · ${{added:'最近添加',newest:'创建时间',oldest:'最早创建'}[state.filters.sort]}`;
    const active=[];if(state.filters.kind!=='all')active.push(kindLabel);if(state.filters.favorite!=='all')active.push(state.filters.favorite==='yes'?'仅收藏':'未收藏');if(state.filters.trash!=='hide')active.push(state.filters.trash==='only'?'废纸篓':'包含废纸篓');if(state.filters.rating!=='all')active.push(state.filters.rating.toUpperCase());
    $('.cg-active-scope').hidden=!active.length;$('[data-filter-summary]').textContent=active.join(' · ');
    $('.cg-offline').hidden=design.availability!=='offline';
    if(!items.length) {$('[data-grid-content]').innerHTML=`<div class="cg-empty">${icon(state.query?'search-x':'images')}<strong>${design.availability==='empty'?'图库里还没有媒体':'没有符合条件的媒体'}</strong><p>${design.availability==='empty'?'在网页端导入后，这里就能查看。':'换个关键词，或试试清除筛选。'}</p>${design.availability!=='empty'?'<button class="cg-pill cg-blue" data-action="reset">清除筛选与搜索</button>':''}</div>`;}
    else if(design.grouping==='continuous') {$('[data-grid-content]').innerHTML=`<div class="cg-grid">${items.map(itemMarkup).join('')}</div>`;}
    else {const groups=new Map();items.forEach(m=>{if(!groups.has(m.day))groups.set(m.day,[]);groups.get(m.day).push(m);});$('[data-grid-content]').innerHTML=[...groups].map(([day,list])=>`<div class="cg-date"><span>${day.replace('2026年','')}</span><small>${list.length} 项</small></div><div class="cg-grid">${list.map(itemMarkup).join('')}</div>`).join('');}
    $('.cg-library-count').textContent=items.length?`${items.filter(m=>m.kind==='image').length} 张图片，${items.filter(m=>m.kind==='video').length} 个视频`:'0 项';
    refreshIcons();if(state.viewer!==null)renderViewer();
  }
  function openSheet(content,label) {returnFocus=document.activeElement;$('.cg-sheet').innerHTML=`<div class="cg-handle"></div>${content}`;$('.cg-sheet').setAttribute('aria-label',label);$('.cg-modal').hidden=false;$('.cg-library').inert=true;$('.cg-viewer').inert=true;refreshIcons();$('.cg-sheet button')?.focus();}
  function closeSheet() {$('.cg-modal').hidden=true;$('.cg-library').inert=state.viewer!==null;$('.cg-viewer').inert=false;returnFocus?.focus();}
  const head=(title,done='close-sheet')=>`<div class="cg-sheet-header"><h2>${title}</h2><button data-action="${done}" aria-label="关闭面板">${icon('x')}</button></div>`;
  function segments(key,options) {return `<div class="cg-segments" role="group" aria-label="${key}">${options.map(([value,label])=>`<button data-filter="${key}" data-value="${value}" aria-pressed="${state.draft[key]===value}" class="${state.draft[key]===value?'chosen':''}">${label}</button>`).join('')}</div>`;}
  function renderFilters() {
    const content=head('筛选与排序')+`<h3>媒体类型</h3>${segments('kind',[['all','全部'],['image','图片'],['video','视频']])}<h3>收藏</h3>${segments('favorite',[['all','不限'],['yes','已收藏'],['no','未收藏']])}<h3>排序</h3><div class="cg-list">${[['added','最近添加'],['newest','创建时间：从新到旧'],['oldest','创建时间：从旧到新']].map(([value,label])=>`<button data-filter="sort" data-value="${value}" aria-pressed="${state.draft.sort===value}">${label}${state.draft.sort===value?icon('check'):''}</button>`).join('')}</div><h3>废纸篓</h3>${segments('trash',[['hide','不显示'],['include','包含'],['only','仅废纸篓']])}<h3>内容分级</h3>${segments('rating',[['all','不限'],['sfw','SFW'],['nsfw','NSFW']])}<p class="cg-note">${state.tab==='favorites'?'正在收藏范围内筛选。':'仅改变当前浏览范围，不会修改媒体。'}</p><button class="cg-apply" data-action="apply-filters">显示 ${filtered(state.draft).length} 项</button><button class="cg-icon-button cg-blue" style="width:100%;margin-top:5px;font-size:13px" data-action="reset-draft">重置筛选</button>`;
    $('.cg-sheet').innerHTML='<div class="cg-handle"></div>'+content;refreshIcons();
  }
  function openViewer(id) {lastScroll=$('.cg-grid-scroll').scrollTop;state.viewerIds=filtered().map(m=>m.id);state.viewer=id;$('.cg-device').classList.add('cg-viewing');$('.cg-viewer').hidden=false;$('.cg-library').inert=true;renderViewer();$('[data-action="close-viewer"]').focus();}
  function renderViewer() {const m=media[state.viewer];if(!m)return;const pos=state.viewerIds.indexOf(m.id);$('[data-view-date]').textContent=m.day.replace('2026年','');$('[data-view-position]').textContent=`${m.time} · ${pos+1} / ${state.viewerIds.length}${m.trash?' · 废纸篓':''}`;$('.cg-media-stage img').src=assets[m.asset];$('.cg-media-stage img').alt=m.name;$('.cg-video-controls').hidden=m.kind!=='video';$('[data-action="zoom"]').hidden=m.kind==='video';$('[data-action="favorite"]').classList.toggle('hearted',m.favorite);$('[data-action="favorite"] span').textContent=m.favorite?'已收藏':'收藏';$('[data-action="favorite"]').setAttribute('aria-pressed',m.favorite);$('[data-action="trash"] span').textContent=m.trash?'恢复':'废纸篓';$('[data-action="favorite"]').disabled=design.availability==='offline';$('[data-action="trash"]').disabled=design.availability==='offline';$('[data-action="previous"]').disabled=pos===0;$('[data-action="next"]').disabled=pos===state.viewerIds.length-1;
    const neighbors=state.viewerIds.slice(Math.max(0,pos-4),pos+5);$('.cg-filmstrip').innerHTML=neighbors.map(id=>`<button class="${id===m.id?'current':''}" data-neighbor="${id}" aria-label="查看第 ${state.viewerIds.indexOf(id)+1} 项" aria-pressed="${id===m.id}"><img src="${assets[media[id].asset]}" alt=""></button>`).join('');refreshIcons();}
  function stopPlayback() {state.playing=false;clearInterval(playTimer);$('.cg-video-controls input').value=0;$('[data-video-time]').textContent='0:00';$('[data-action="play"]').innerHTML=icon('play');$('.cg-media-stage').classList.remove('zoom');refreshIcons();}
  function navigate(id) {stopPlayback();state.viewer=id;renderViewer();}
  function closeViewer() {const id=state.viewer;stopPlayback();state.viewer=null;$('.cg-device').classList.remove('cg-viewing');$('.cg-viewer').hidden=true;$('.cg-viewer').classList.remove('cg-viewer-clean');$('.cg-library').inert=false;render();$('.cg-grid-scroll').scrollTop=lastScroll;const tile=$(`[data-media="${id}"]`);if(tile){tile.scrollIntoView({block:'nearest'});tile.focus({preventScroll:true});}}
  function togglePlayback() {state.playing=!state.playing;$('[data-action="play"]').innerHTML=icon(state.playing?'pause':'play');$('[data-action="play"]').setAttribute('aria-label',state.playing?'暂停模拟播放':'模拟播放');clearInterval(playTimer);if(state.playing){toast('视频交互演示 · 当前使用静态封面');playTimer=setInterval(()=>{const range=$('.cg-video-controls input');range.value=(+range.value+1)%13;$('[data-video-time]').textContent=`0:${String(range.value).padStart(2,'0')}`;},1000);}refreshIcons();}
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.media!==undefined){const id=+b.dataset.media;if(state.selecting){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render();}else openViewer(id);return;}
    if(b.dataset.neighbor!==undefined){navigate(+b.dataset.neighbor);return;}
    if(b.dataset.tab){state.tab=b.dataset.tab;state.query='';state.filters={...defaults};state.selected.clear();render();$('.cg-grid-scroll').scrollTop=0;persist();return;}
    if(b.dataset.filter){const key=b.dataset.filter;state.draft[key]=b.dataset.value;renderFilters();$(`[data-filter="${key}"][data-value="${state.draft[key]}"]`)?.focus();return;}
    const a=b.dataset.action;
    if(a==='filters'){state.draft={...state.filters};openSheet('','筛选和排序');renderFilters();$('.cg-sheet button').focus();}
    if(a==='close-sheet')closeSheet();
    if(a==='reset-draft'){state.draft={...defaults};renderFilters();}
    if(a==='apply-filters'){state.filters={...state.draft};state.selected.clear();closeSheet();render();$('.cg-grid-scroll').scrollTop=0;persist();}
    if(a==='reset'){state.filters={...defaults};state.query='';state.selected.clear();render();persist();}
    if(a==='clear-search'){state.query='';render();$('.cg-search-box input').focus();}
    if(a==='select'){state.selecting=!state.selecting;state.selected.clear();render();}
    if(a==='select-all'){const items=filtered();state.selected=state.selected.size===items.length?new Set():new Set(items.map(m=>m.id));render();}
    if(a==='bulk-favorite'){state.selected.forEach(id=>media[id].favorite=true);toast(`原型：已收藏 ${state.selected.size} 项`);state.selected.clear();state.selecting=false;render();}
    if(a==='bulk-trash'){openSheet(head('移到废纸篓？')+`<p class="cg-note">将所选 ${state.selected.size} 项移到废纸篓，可恢复。此处仅修改演示数据。</p><button class="cg-apply" data-action="confirm-bulk-trash">移到废纸篓</button>`,'确认移到废纸篓');}
    if(a==='confirm-bulk-trash'){state.selected.forEach(id=>media[id].trash=true);state.selected.clear();state.selecting=false;closeSheet();render();toast('原型：已移到废纸篓');}
    if(a==='close-viewer')closeViewer();
    if(a==='previous'||a==='next'){const pos=state.viewerIds.indexOf(state.viewer);const id=state.viewerIds[pos+(a==='next'?1:-1)];if(id!==undefined)navigate(id);}
    if(a==='favorite'){media[state.viewer].favorite=!media[state.viewer].favorite;renderViewer();toast(media[state.viewer].favorite?'原型：已添加收藏':'原型：已取消收藏');}
    if(a==='trash'){media[state.viewer].trash=!media[state.viewer].trash;renderViewer();toast(media[state.viewer].trash?'原型：已移到废纸篓，可再次点击恢复':'原型：已恢复');}
    if(a==='toggle-chrome')$('.cg-viewer').classList.toggle('cg-viewer-clean');
    if(a==='zoom')$('.cg-media-stage').classList.toggle('zoom');
    if(a==='play')togglePlayback();
    if(a==='mute'){state.muted=!state.muted;b.innerHTML=icon(state.muted?'volume-x':'volume-2');b.setAttribute('aria-label',state.muted?'取消静音':'静音');refreshIcons();}
    if(a==='info'){const m=media[state.viewer];openSheet(head('媒体信息')+`<dl><dt>类型</dt><dd>${m.kind==='video'?'视频 · 0:12':'图片'}</dd><dt>添加时间</dt><dd>${m.day} ${m.time}</dd><dt>收藏</dt><dd>${m.favorite?'已收藏':'未收藏'}</dd><dt>内容分级</dt><dd>SFW</dd></dl><p class="cg-note">第一阶段专注查看与整理。输入媒体、评价与空间视频动作将在后续详情面板加入。</p>`,'媒体信息');}
    if(a==='account')openSheet(head('图库连接')+`<div class="cg-list"><button data-action="demo-connection"><span>我的图库</span><span class="cg-blue">演示模式</span></button><button data-action="appearance"><span>外观</span><span>${design.appearance==='dark'?'深色':'浅色 / 系统'}</span></button><button data-action="offline"><span>预览离线状态</span>${icon('wifi-off')}</button></div><p class="cg-note">当前为本地设计稿，未连接服务器。正式版沿用服务器地址与设备 Token 登录。</p>`,'图库连接');
    if(a==='demo-connection')openSheet(head('连接图库')+`<div class="cg-fields"><label>服务器地址<input placeholder="https://gallery.example.com" type="url" autocomplete="off"></label><label>设备 Token<input type="password" placeholder="粘贴网页端创建的 Token" autocomplete="off"></label></div><button class="cg-apply" data-action="demo-connected">预览连接后的图库</button><p class="cg-note">交互示意：不会发送、保存或验证输入的信息。</p>`,'连接图库');
    if(a==='demo-connected'){closeSheet();toast('已返回示例图库 · 未实际连接服务器');}
    if(a==='appearance'){design.appearance=design.appearance==='dark'?'light':'dark';closeSheet();render();persist();}
    if(a==='offline'){design.availability=design.availability==='offline'?'normal':'offline';closeSheet();render();}
  });
  $('.cg-modal').addEventListener('click',e=>{if(e.target===$('.cg-modal'))closeSheet();});
  $('.cg-search-box input').addEventListener('input',e=>{state.query=e.target.value;render();persist();});
  $('.cg-video-controls input').addEventListener('input',e=>{$('[data-video-time]').textContent=`0:${String(e.target.value).padStart(2,'0')}`;});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('.cg-modal').hidden)closeSheet();else if(state.viewer!==null)closeViewer();}if(!$('.cg-modal').hidden&&e.key==='Tab'){const els=[...$('.cg-sheet').querySelectorAll('button:not(:disabled),input')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(state.viewer!==null&&$('.cg-modal').hidden&&!['INPUT'].includes(e.target.tagName)){if(e.key==='ArrowRight')$('[data-action="next"]').click();if(e.key==='ArrowLeft')$('[data-action="previous"]').click();}});
  let touchX=null;$('.cg-media-stage').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});$('.cg-media-stage').addEventListener('touchend',e=>{if(touchX===null)return;const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>70){const button=$(`[data-action="${delta<0?'next':'previous'}"]`);if(!button.disabled)button.click();}touchX=null;},{passive:true});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'appearance',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});tweak.addSelect(design,'grouping',{label:'时间组织',options:[{label:'按天分组',value:'days'},{label:'连续网格',value:'continuous'}]});tweak.addSlider(design,'columns',{label:'网格列数',min:2,max:5,step:1});tweak.addSelect(design,'availability',{label:'图库状态',options:[{label:'正常',value:'normal'},{label:'离线缓存',value:'offline'},{label:'尚无媒体',value:'empty'}]});}
  root.cgPreview={setDesign(p){Object.assign(design,p);render();},setFilters(p){Object.assign(state.filters,p);render();},openViewer,closeViewer,render};
})();
</script>
