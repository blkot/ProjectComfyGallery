[versions]
agp = "8.11.1"
kotlin = "2.1.0"
spatial = "0.14.0"
compose = "2024.09.03"
media3 = "1.4.1"
coroutines = "1.9.0"
okhttp = "4.12.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
spatial-base = { module = "com.meta.spatial:meta-spatial-sdk", version.ref = "spatial" }
spatial-vr = { module = "com.meta.spatial:meta-spatial-sdk-vr", version.ref = "spatial" }
spatial-toolkit = { module = "com.meta.spatial:meta-spatial-sdk-toolkit", version.ref = "spatial" }
spatial-compose = { module = "com.meta.spatial:meta-spatial-sdk-compose", version.ref = "spatial" }
spatial-isdk = { module = "com.meta.spatial:meta-spatial-sdk-isdk", version.ref = "spatial" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.2" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.6" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
junit = { module = "junit:junit", version = "4.13.2" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
