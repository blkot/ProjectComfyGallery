name: Release images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_ROOT: ghcr.io/blkot/project-comfy-gallery

jobs:
  validate:
    name: Validate milestone
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        name: Validate tag and locked version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})." >&2
            exit 1
          fi
          if ! grep -Fq "## ${version} " CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Validate Compose release configuration
        env:
          POSTGRES_PASSWORD: release-validation
          CG_ADMIN_PASSWORD: release-validation
          CG_IMAGE_NAMESPACE: ghcr.io/blkot/project-comfy-gallery
          CG_IMAGE_TAG: ${{ steps.release.outputs.version }}
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

  build:
    name: Build ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: deploy/docker/backend.Dockerfile
          - image: web
            dockerfile: deploy/docker/web.Dockerfile
          - image: backup
            dockerfile: deploy/docker/backup.Dockerfile
          - image: postgres
            dockerfile: deploy/docker/database.Dockerfile
          - image: redis
            dockerfile: deploy/docker/redis.Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and publish immutable AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_ROOT }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE_ROOT }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            CG_PROJECT_VERSION=${{ needs.validate.outputs.version }}
            CG_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            CG_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_ROOT }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write release summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "- Version: \`${{ needs.validate.outputs.version }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
