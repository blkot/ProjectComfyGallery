[project]
name = "project-comfy-gallery"
version = "0.1.0-rc.9"
description = "Self-hosted ComfyUI media intelligence and evaluation system"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
    "types-aiofiles>=25.1.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/py/core",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "packages/py/core/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "apps/api/src",
    "apps/worker/src",
    "packages/py/core/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/py/core/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
mypy_path = [
    "packages/py/core/src",
    "apps/api/src",
    "apps/worker/src",
]
packages = [
    "comfy_gallery_core",
    "comfy_gallery_api",
    "comfy_gallery_worker",
]

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true
